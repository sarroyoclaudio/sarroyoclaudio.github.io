<style>
:root{
  --green:#2E4636;--green-d:#1E2E24;--green-l:#86948A;
  --gold:#C39A3E;--gold-l:#DCC48F;--gold-ll:#EEE3C9;
  --blue:#2C5C7F;--blue-d:#1D3D54;--blue-l:#85A0B5;
  --gun:#23282A;--gun-d:#171A1C;--sand:#E4DAC6;--bone:#FAF7F1;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--gun-d);font-family:var(--sans);color:var(--bone)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.hot{cursor:pointer}
.panel{position:fixed;background:rgba(23,26,28,.82);border:1.5px solid rgba(195,154,62,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mono{font-family:var(--mono)}
/* header */
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;pointer-events:none}
#brand{pointer-events:auto;background:var(--green);border:2px solid var(--gun);padding:10px 14px;max-width:min(560px,70vw)}
#brand .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
#brand h1{font-size:clamp(17px,2.2vw,22px);font-weight:800;line-height:1.15;margin-top:3px}
#brand .sub{font-family:var(--mono);font-size:11px;color:var(--sand);margin-top:3px;letter-spacing:.04em}
#tag{display:inline-block;margin-top:7px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;background:var(--gold);color:var(--gun);padding:3px 7px;font-weight:700}
#ctl{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;cursor:pointer}
.btn{background:rgba(23,26,28,.85);color:var(--bone);border:1.5px solid var(--gold);padding:7px 11px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em}
.btn:hover{background:var(--green)}
.btn.on{background:var(--gold);color:var(--gun);font-weight:700}
.seg{display:flex}
.seg .btn+.btn{border-left:none}
/* phase panel */
#phase{left:16px;top:142px;width:330px;padding:14px 16px 12px}
#phase .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
#phase h2{font-size:19px;line-height:1.2;margin:5px 0 7px;font-weight:800}
#phase p{font-size:13.5px;line-height:1.5;color:var(--sand)}
#tasks{list-style:none;margin-top:10px;border-top:1px solid rgba(228,218,198,.18);padding-top:8px}
#tasks li{font-family:var(--mono);font-size:12px;padding:3px 0 3px 22px;position:relative;color:#A5A39F;transition:color .3s}
#tasks li::before{content:"";position:absolute;left:2px;top:6px;width:11px;height:11px;border:1.5px solid #7F8283}
#tasks li.done{color:var(--bone)}
#tasks li.done::before{background:var(--gold);border-color:var(--gold)}
#tasks li.done::after{content:"";position:absolute;left:5.5px;top:7px;width:4px;height:7px;border:solid var(--gun);border-width:0 2px 2px 0;transform:rotate(45deg)}
/* kpi */
#kpi{right:16px;top:142px;width:262px;padding:12px 14px;max-height:calc(100vh - 250px);overflow:auto}
#kpi h3,#ops h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;font-weight:600}
.row{margin:7px 0}
.row .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--sand)}
.row .lbl b{font-family:var(--mono);color:var(--bone);font-weight:600}
.bar{height:6px;background:#2a3133;margin-top:4px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);width:0}
.bar.blue i{background:var(--blue-l)}
.bar.green i{background:var(--green-l)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.chips button{font-family:var(--mono);font-size:10.5px;padding:3px 0;background:#2a3133;color:#7F8283;border:1px solid #3a4244;transition:all .3s}
.chips button.on{background:var(--blue);color:var(--bone);border-color:var(--blue-l)}
#ops{margin-top:12px;border-top:1px solid rgba(228,218,198,.18);padding-top:10px;display:none}
#ops.show{display:block}
.kv{display:flex;justify-content:space-between;align-items:baseline;margin:5px 0;font-size:12px;color:var(--sand)}
.kv b{font-family:var(--mono);font-size:15px;color:var(--gold-l)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
/* card */
#card{right:16px;bottom:96px;width:300px;padding:12px 14px;display:none}
#card.show{display:block}
#card h4{font-size:15px;margin-bottom:5px;padding-right:22px}
#card p{font-size:13px;line-height:1.5;color:var(--sand)}
#card .as{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gun);background:var(--sand);padding:2px 6px}
#card .x{position:absolute;right:8px;top:6px;background:none;border:none;color:var(--sand);font-size:18px}
/* toast */
#toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;top:24px;background:var(--gun);border:1.5px solid var(--gold);color:var(--bone);font-family:var(--mono);font-size:12.5px;padding:8px 14px;display:none;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{display:block}
#toast.warn{border-color:#B4473A}
#toast.ok{border-color:var(--green-l)}
#hint{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--sand);background:rgba(23,26,28,.7);padding:5px 10px;pointer-events:none;white-space:nowrap;transition:opacity .5s}
/* timeline */
#tl{left:0;right:0;bottom:0;padding:10px 16px 8px;border-left:none;border-right:none;border-bottom:none}
#tlrow{display:flex;align-items:center;gap:10px}
#track{flex:1;height:26px;position:relative;display:flex;cursor:pointer;user-select:none}
#track .sg{position:relative;height:100%;border-right:2px solid var(--gun-d);background:#2c3436;overflow:hidden}
#track .sg span{position:absolute;left:5px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--sand);white-space:nowrap;pointer-events:none;z-index:2}
#track .sg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green)}
#track .sg.cur::after{content:"";position:absolute;inset:0;border:1.5px solid var(--gold);z-index:3;pointer-events:none}
#head{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--gold);left:0;pointer-events:none;z-index:3}
#time{font-family:var(--mono);font-size:11px;color:var(--sand);min-width:74px;text-align:right}
#foot{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:10.5px;color:#A5A39F}
#foot b{color:var(--gold-l);font-weight:600}
/* about */
#about{position:fixed;inset:0;background:rgba(10,12,13,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#about.show{display:flex}
#about .box{background:var(--bone);color:var(--gun);max-width:640px;width:100%;max-height:86vh;overflow:auto;border:2px solid var(--gun)}
#about .hd{background:var(--green);color:var(--bone);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
#about .hd h3{font-size:18px}
#about .bd{padding:14px 18px 18px;font-size:13.5px;line-height:1.55}
#about .bd h5{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin:14px 0 6px;border-bottom:1.5px solid var(--gun);padding-bottom:4px}
#about ul{padding-left:18px}
#about a{color:var(--blue)}
#about .x{background:var(--gold);color:var(--gun);border:none;padding:6px 10px;font-family:var(--mono);font-weight:700}
@media (max-width:860px){
  #kpi{display:none}
  #phase{top:auto;bottom:100px;left:10px;right:10px;width:auto;padding:10px 12px}
  #phase h2{font-size:16px}
  #phase p{font-size:12.5px}
  #tasks{display:none}
  #card{left:10px;right:10px;width:auto;bottom:100px;z-index:5}
  #toast{top:150px}
  #hint{display:none}
  #track .sg span{display:none}
  #foot{flex-direction:column;gap:2px}
  #brand{max-width:62vw}
  #brand .eyebrow,#brand .sub{display:none}
  #rstBtn,#spd,#time{display:none}
  #track{min-width:120px}
}
</style>
</head>

<div id="toast"></div>
<div id="hint" data-i="hint"></div>

<footer id="tl" class="panel">

  <div id="foot"><span data-i="foot"></span><span><b data-i="credit"></b></span></div>
</footer>

 hubLabel:'ROCC · Austin',
 aboutHtml:`<p>This interactive 3D animation shows how a project team could plan, build, connect, secure, test, and launch SunPower's Remote Operations Control Center (ROCC). It is a portfolio visualization. It does not show the real facility, network, or vendor designs.</p>
<h5>Public facts used</h5>
<ul>
<li>SunPower launched the ROCC on October 6, 2015, in its Austin, Texas office.</li>
<li>The ROCC monitors and controls SunPower-operated U.S. plants and monitors plants on five continents outside North America.</li>
<li>Eight staff run it 24 hours a day, 7 days a week, 365 days a year.</li>
<li>The fleet under watch was expected to reach about 1.3 GW by 2016.</li>
</ul>
<h5>Project facts</h5>
<ul><li>Santos "JR" Arroyo Claudio, PMP, served as IT Project Manager / Project Coordinator for the $3M ROCC build-out and commissioning, January to October 2015.</li></ul>
<h5>Assumptions</h5>
<ul>
<li>The existing Austin office appears as a stylized one-story shell.</li>
<li>The ROCC is shown built to medium-impact CIP controls. Its actual impact rating is not public.</li>
<li>Month-by-month schedule and the budget S-curve.</li>
<li>Plant locations are representative regions, not actual plant sites.</li>
<li>Equipment counts and layout: 3 cooling units, 8 racks, a 4x2 video wall, one server room door.</li>
<li>Network design: MPLS and VPN primary links, cellular and satellite backup, IEC 62443 zones on a Purdue model, mapped to NERC CIP v5.</li>
<li>Test sequence and the failover drill.</li>
</ul>
<h5>NERC CIP context</h5>
<ul>
<li>FERC Order No. 791 (November 2013) approved the CIP version 5 standards, CIP-002-5 through CIP-011-1.</li>
<li>FERC later moved the compliance date to July 1, 2016, so a 2015 build would plan for version 5.</li>
<li>Under CIP-002-5.1, a control center that performs Generator Operator duties for 1,500 MW or more in one Interconnection rates medium impact. Below that it rates low impact.</li>
</ul>
<h5>Sources</h5>
<ul>
<li><a href="https://newsroom.sunpower.com/2015-10-06-SunPower-Optimizing-U-S-Solar-Power-Plant-Production-with-Remote-Operations-Control-Center" target="_blank" rel="noopener">SunPower Newsroom, Oct 6, 2015</a></li>
<li><a href="https://www.ferc.gov/sites/default/files/2020-04/E-5_7.pdf" target="_blank" rel="noopener">FERC Order No. 791-A (CIP version 5)</a></li>

 aboutHtml:`<p>Esta animación 3D interactiva muestra cómo un equipo de proyecto podría planificar, construir, conectar, proteger, probar e inaugurar el Centro de Control de Operaciones Remotas (ROCC) de SunPower. Es una visualización de portafolio. No muestra la instalación, la red ni los diseños reales de proveedores.</p>
<h5>Datos públicos usados</h5>
<ul>
<li>SunPower inauguró el ROCC el 6 de octubre de 2015 en su oficina de Austin, Texas.</li>
<li>El ROCC monitorea y controla plantas operadas por SunPower en EE. UU. y monitorea plantas en cinco continentes fuera de Norteamérica.</li>
<li>Ocho empleados lo operan las 24 horas, los 7 días, los 365 días del año.</li>
<li>Se esperaba que la flota monitoreada llegara a cerca de 1.3 GW para 2016.</li>
</ul>
<h5>Datos del proyecto</h5>
<ul><li>Santos "JR" Arroyo Claudio, PMP, fue Gerente de Proyectos de TI / Coordinador del proyecto de $3M para construir y poner en marcha el ROCC, de enero a octubre de 2015.</li></ul>
<h5>Supuestos</h5>
<ul>
<li>La oficina existente en Austin se muestra como un edificio estilizado de un piso.</li>
<li>El ROCC se muestra con controles CIP de impacto medio. Su clasificación real no es pública.</li>
<li>El cronograma mensual y la curva S del presupuesto.</li>
<li>Las ubicaciones de plantas son regiones representativas, no sitios reales.</li>
<li>Cantidad y disposición de equipos: 3 unidades de enfriamiento, 8 racks, pared de video 4x2.</li>
<li>Diseño de red: enlaces primarios MPLS y VPN, respaldo celular y satelital, zonas IEC 62443 sobre un modelo Purdue, alineadas con NERC CIP v5.</li>
<li>La secuencia de pruebas y el simulacro de conmutación.</li>
</ul>
<h5>Contexto NERC CIP</h5>
<ul>
<li>La Orden No. 791 de FERC (noviembre de 2013) aprobó las normas CIP versión 5, de CIP-002-5 a CIP-011-1.</li>
<li>FERC luego movió la fecha de cumplimiento al 1 de julio de 2016, así que una obra en 2015 planificaría para la versión 5.</li>
<li>Según CIP-002-5.1, un centro de control que cumple funciones de Operador de Generación para 1,500 MW o más en una Interconexión tiene impacto medio. Por debajo, tiene impacto bajo.</li>
</ul>
<h5>Fuentes</h5>
<ul>
<li><a href="https://newsroom.sunpower.com/2015-10-06-SunPower-Optimizing-U-S-Solar-Power-Plant-Production-with-Remote-Operations-Control-Center" target="_blank" rel="noopener">SunPower Newsroom, 6 oct 2015</a></li>

/* animation registry: every build state is a pure function of t so scrubbing works */
const anims=[];
function anim(obj,t0,dur,type='grow',o={}){
 obj.userData.base={p:obj.position.clone(),s:obj.scale.clone()};
 anims.push({obj,t0,dur,type,out:o.out,outDur:o.outDur||1.5,h:o.h||8,fn:o.fn});return obj;
}
function applyAnims(t){
 for(const a of anims){
  const p=clamp((t-a.t0)/a.dur);let k=1;
  if(a.out!=null)k=1-ease(clamp((t-a.out)/a.outDur));
  const vis=p>0&&k>.001;a.obj.visible=vis;if(!vis)continue;
  const b=a.obj.userData.base,e=ease(p);
  a.obj.position.copy(b.p);a.obj.scale.copy(b.s);
  switch(a.type){
   case'grow':a.obj.scale.y=b.s.y*Math.max(e*k,.001);break;
   case'growZ':a.obj.scale.z=b.s.z*Math.max(e*k,.001);break;
   case'pop':a.obj.scale.multiplyScalar(Math.max(back(p)*k,.001));break;
   case'drop':a.obj.position.y=b.p.y+(1-e)*a.h+(1-k)*a.h;break;
   case'fn':a.fn(p,e,k);break;
  }
 }
}

 else if(k.startsWith('site:')){const i=+k.split(':')[1];it=L().info.site;title=SITES[i].n[lang==='es'?1:0]+' · '+it[0];}else{it=L().info[k];title=it&&it[0];}
 if(!it)return;$('cT').textContent=title;$('cB').textContent=it[1];$('cA').style.display=it[2]?'inline-block':'none';$('card').classList.add('show');}
$('cardX').onclick=()=>{$('card').classList.remove('show');cardKey=null;};
// picking
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
const shown=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};
function pick(ev){const r=canvas.getBoundingClientRect();mouse.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObjects(clickables,true);for(const h of hits){if(h.object.isSprite)continue;if(!shown(h.object))continue;let o=h.object;while(o&&!o.userData.key)o=o.parent;if(o)return o.userData.key;}return null;}
let down=null,hovT=0;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6){const k=pick(e);if(k)showCard(k);}down=null;});
canvas.addEventListener('pointermove',e=>{if(e.buttons)return;const n=performance.now();if(n-hovT<80)return;hovT=n;canvas.classList.toggle('hot',!!pick(e));});
controls.addEventListener('start',()=>{if(guided){guided=false;updBtns();}});
// buttons
$('playBtn').onclick=()=>{if(!playing&&t>=T){t=0;idle=0;}playing=!playing;updBtns();};
$('rstBtn').onclick=()=>{t=0;idle=0;playing=true;guided=true;updBtns();};
$('camBtn').onclick=()=>{guided=!guided;updBtns();};
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;updBtns();});
$('lenBtn').onclick=()=>{lang='en';applyLang();};$('lesBtn').onclick=()=>{lang='es';applyLang();};
$('aboutBtn').onclick=()=>$('about').classList.add('show');$('aboutX').onclick=()=>$('about').classList.remove('show');
$('about').addEventListener('click',e=>{if(e.target.id==='about')$('about').classList.remove('show');});
let drag=false;
function seek(e){const r=track.getBoundingClientRect();t=clamp((e.clientX-r.left)/r.width)*T;idle=0;guided=true;updBtns();}
track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);seek(e);});
track.addEventListener('pointermove',e=>{if(drag)seek(e);});
track.addEventListener('pointerup',()=>{drag=false;});
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if(e.code==='Space'){e.preventDefault();$('playBtn').click();}
 if(e.code==='ArrowRight'){let i=PH.findIndex(p=>p.s>t+.01);if(i<0)i=PH.length-1;t=PH[i].s+.01;guided=true;updBtns();}
 if(e.code==='ArrowLeft'){let i=0;for(let j=0;j<PH.length;j++)if(PH[j].s<t-.6)i=j;t=PH[i].s+.01;guided=true;updBtns();}});

function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=camera.aspect<1?Math.min(75,2*Math.atan(Math.tan(27.5*D)/camera.aspect)/D):45;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
applyLang();

function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;amb+=dt;
 if(playing){t+=dt*speed;if(t>=T){t=T;playing=false;updBtns();}}
 if(t>=T)idle+=dt;else idle=0;
 update(t);
 if(guided){camAt(t);camera.position.copy(cp);controls.target.copy(cg);camera.lookAt(cg);}else controls.update();
 renderer.render(scene,camera);requestAnimationFrame(frame);
}
window.__rocc={seek:v=>{t=v;playing=false;updBtns();},get t(){return t;}};
requestAnimationFrame(frame);
})();
</script>
</body>
