html,body{height:100%;overflow:hidden;background:var(--gun-d);font-family:var(--sans);color:var(--bone)}

#tasks{list-style:none;margin-top:10px;border-top:1px solid rgba(228,218,198,.18);padding-top:8px}

#tasks li::before{content:"";position:absolute;left:2px;top:6px;width:11px;height:11px;border:1.5px solid #7F8283}
#tasks li.done{color:var(--bone)}
#tasks li.done::before{background:var(--gold);border-color:var(--gold)}
#tasks li.done::after{content:"";position:absolute;left:5.5px;top:7px;width:4px;height:7px;border:solid var(--gun);border-width:0 2px 2px 0;transform:rotate(45deg)}

#kpi{right:16px;top:142px;width:262px;padding:12px 14px;max-height:calc(100vh - 250px);overflow:auto}

.row{margin:7px 0}
.row .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--sand)}
.row .lbl b{font-family:var(--mono);color:var(--bone);font-weight:600}

#ops.show{display:block}
.kv{display:flex;justify-content:space-between;align-items:baseline;margin:5px 0;font-size:12px;color:var(--sand)}
.kv b{font-family:var(--mono);font-size:15px;color:var(--gold-l)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}

#card .x{position:absolute;right:8px;top:6px;background:none;border:none;color:var(--sand);font-size:18px}

#toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;top:24px;background:var(--gun);border:1.5px solid var(--gold);color:var(--bone);font-family:var(--mono);font-size:12.5px;padding:8px 14px;display:none;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{display:block}
#toast.warn{border-color:#B4473A}
#toast.ok{border-color:var(--green-l)}
#hint{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--sand);background:rgba(23,26,28,.7);padding:5px 10px;pointer-events:none;white-space:nowrap;transition:opacity .5s}

#tlrow{display:flex;align-items:center;gap:10px}
#track{flex:1;height:26px;position:relative;display:flex;cursor:pointer;user-select:none}
#track .sg{position:relative;height:100%;border-right:2px solid var(--gun-d);background:#2c3436;overflow:hidden}
#track .sg span{position:absolute;left:5px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--sand);white-space:nowrap;pointer-events:none;z-index:2}
#track .sg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--green)}
#track .sg.cur::after{content:"";position:absolute;inset:0;border:1.5px solid var(--gold);z-index:3;pointer-events:none}

#time{font-family:var(--mono);font-size:11px;color:var(--sand);min-width:74px;text-align:right}

#about ul{padding-left:18px}
#about a{color:var(--blue)}
#about .x{background:var(--gold);color:var(--gun);border:none;padding:6px 10px;font-family:var(--mono);font-weight:700}

  #phase p{font-size:12.5px}
  #tasks{display:none}
  #card{left:10px;right:10px;width:auto;bottom:100px;z-index:5}

  #track{min-width:120px}

#kpi .mode{font-family:var(--mono);font-size:12px;padding:1px 6px;border:1px solid var(--blue-l);color:var(--blue-l)}
#kpi .mode.isl{border-color:var(--gold);color:var(--gold)}
</style>

<h5>Public facts used</h5>
<ul>
<li>Cooperativa Hidroeléctrica de la Montaña (CHM) formed in 2019 as Puerto Rico's first electric power cooperative.</li>
<li>ReEnFoCo (Resiliencia Energética Fotovoltaica Comunitaria) installs rooftop solar with battery storage configured as microgrids.</li>
<li>CHM inaugurated the Castañer microgrid, ReEnFoCo Phase 1(A), on May 26, 2022.</li>
<li>Phase 2 develops Community Energy Resilience Hubs (CERH).</li>
<li>The program serves local businesses, community centers, and some homes in Adjuntas, Jayuya, Lares, and Utuado.</li>

 aboutHtml:`<p>Esta animación 3D interactiva muestra cómo los datos de campo capturados con Microsoft Power Platform pueden alimentar el diseño de microrredes solares con baterías en techos para pequeños comercios de la montaña de Puerto Rico. Es una visualización de portafolio de un pueblo ilustrativo, no de un sitio real.</p>
<h5>Datos públicos usados</h5>
<ul>
<li>La Cooperativa Hidroeléctrica de la Montaña (CHM) se formó en 2019 como la primera cooperativa de energía eléctrica de Puerto Rico.</li>
<li>ReEnFoCo (Resiliencia Energética Fotovoltaica Comunitaria) instala energía solar en techos con baterías configuradas como microrredes.</li>
<li>La CHM inauguró la microrred de Castañer, Fase 1(A) de ReEnFoCo, el 26 de mayo de 2022.</li>
<li>La Fase 2 desarrolla Centros Comunitarios de Resiliencia Energética (CERH).</li>
<li>El programa sirve a comercios locales, centros comunitarios y algunas residencias en Adjuntas, Jayuya, Lares y Utuado.</li>
</ul>
<h5>Datos del proyecto</h5>
<ul><li>Santos "JR" Arroyo Claudio diseñó la solución en Power Platform: apps canvas y model-driven en Power Apps, el esquema de Dataverse, flujos de Power Automate y dashboards de Power BI para la captura de datos de campo y el dimensionamiento de microrredes.</li></ul>
<h5>Supuestos</h5>
<ul>
<li>El pueblo, los edificios y la calle son genéricos e ilustrativos.</li>
<li>Valores de encuesta, cargas, kW solares y kWh de batería por sitio.</li>
<li>Las pantallas de la app, los campos de las tablas y los pasos del flujo son representativos.</li>
<li>La tormenta, la duración del apagón y las horas cubiertas son simuladas.</li>
</ul>

function update(t){
 applyAnims(t);
 const nf=night(t);const flash=(t>86.1&&t<86.25)||(t>86.8&&t<86.9)||(t>89.4&&t<89.5);
 SKY.copy(SKY_DAY).lerp(SKY_NIGHT,nf);if(flash)SKY.set(0xc8d4dc);scene.fog.color.copy(SKY);
 hemi.intensity=.65-.5*nf;sun.intensity=.95*(1-nf);moon.intensity=.35*nf;
 const gridUp=!(t>=GRID_DOWN&&t<RESTORE);
 M.winB.emissiveIntensity=.15+.95*nf;M.winH.emissiveIntensity=gridUp?.15+.85*nf:0;M.lamp.emissiveIntensity=gridUp?1.2*nf:0;
 wireMat.color.setHex(gridUp?0x1d2223:0x3a2020);
 M.led.emissiveIntensity=.6+.4*Math.sin(amb*3);
 // agent
 const st=agentPos(t,tmpV);agent.position.copy(tmpV);agent.visible=t>=26&&t<41;agent.rotation.y=st===2?Math.PI:Math.PI/2;agent.position.y=st===1?Math.abs(Math.sin(amb*9))*.08:0;
 const pTop=new THREE.Vector3(0,15,-27.5);
 packets.forEach((m,i)=>{const p=clamp((t-SUBMIT[i])/1.6);m.visible=p>0&&p<1;if(m.visible){const a=new THREE.Vector3(BIZ[i].x-1.8,2.4,STOPZ),mid=a.clone().lerp(pTop,.5);mid.y+=6;
  const q=new THREE.QuadraticBezierCurve3(a,mid,pTop);m.position.copy(q.getPoint(ease(p)));}});
 // soc bars
 socBars.forEach((b,i)=>{b.scale.x=Math.max(.02,soc(i,t));});
 // energy flow
 flows.forEach((f,i)=>{const on=t>=78;f.ps.forEach((m,k)=>{m.visible=on&&!(t>=GRID_DOWN&&t<ISLAND);if(!m.visible)return;const u=frac(amb*.45+k/3+i*.17);
  if(nf<.5){lpath([f.roof,f.bat,f.door],u,m.position);m.material.color.setHex(C.goldL);}else{lpath([f.bat,f.door],u,m.position);m.material.color.setHex(C.blueL);}});});
 tele.forEach((m,i)=>{m.visible=t>=78;if(!m.visible)return;const u=frac(amb*.25+i*.2);const a=new THREE.Vector3(BIZ[i].x+6,2.6,BZ+1.5);const mid=a.clone().lerp(pTop,.5);mid.y+=5;m.position.copy(new THREE.QuadraticBezierCurve3(a,mid,pTop).getPoint(u));});
 // rain
 const rv=t>=84.8&&t<93;rain.visible=rv;if(rv){for(let i=0;i<RAIN;i++){const [x,z,o]=rainSeed[i];const y=34-frac(amb*1.4+o)*34;rainPos.set([x,y,z,x-.3,y-1.6,z],i*6);}rainGeo.attributes.position.needsUpdate=true;}
 if(panelG.visible)drawPanel(t,amb);if(phone.visible)drawPhone(t);
 updateUI(t,gridUp);
}

/* ---------- UI ---------- */
const track=$('track'),head=$('head');const segs=[];
PH.forEach((p)=>{const s=document.createElement('div');s.className='sg';s.style.width=((p.e-p.s)/T*100)+'%';s.innerHTML='<i></i><span></span>';track.insertBefore(s,head);segs.push(s);});
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>{const v=L()[el.dataset.i];if(v!=null)el.textContent=v;});
 $('aboutBody').innerHTML=L().aboutHtml;segs.forEach((s,i)=>{s.querySelector('span').textContent=(i+1)+' '+L().short[i];s.title=L().ph[i].t;});
 $('lenBtn').classList.toggle('on',lang==='en');$('lesBtn').classList.toggle('on',lang==='es');labels.forEach(l=>l.userData.draw());curPh=-1;updBtns();if(cardKey)showCard(cardKey);
 try{localStorage.setItem('reenfoco-lang',lang);}catch(e){}}
function updBtns(){$('playBtn').textContent=playing?L().pause:L().play;const cb=$('camBtn');cb.textContent=guided?L().guided:L().free;cb.classList.toggle('on',!guided);document.querySelectorAll('[data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===speed));}
let lastK=0,toastKey=null;
function updateUI(t,gridUp){let idx=0;for(let i=0;i<PH.length;i++)if(t>=PH[i].s)idx=i;
 if(idx!==curPh){curPh=idx;const P=L().ph[idx];$('phEy').textContent=L().step+' '+String(idx+1).padStart(2,'0')+' / '+PH.length;$('phT').textContent=P.t;$('phD').textContent=P.d;$('tasks').innerHTML=P.k.map(k=>'<li>'+k+'</li>').join('');segs.forEach((s,i)=>s.classList.toggle('cur',i===idx));}
 const lis=$('tasks').children;for(let k=0;k<lis.length;k++)lis[k].classList.toggle('done',t>=ticks[idx][k]);
 segs.forEach((s,i)=>{s.firstChild.style.width=(clamp((t-PH[i].s)/(PH[i].e-PH[i].s))*100)+'%';});head.style.left='calc('+(t/T*100)+'% - 1.5px)';
 $('time').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 1:52';
 let tk=null;for(const x of TOASTS)if(t>=x[0]&&t<x[1])tk=x;const to=$('toast');
 if(tk){if(toastKey!==tk[2]+lang){to.textContent=L().toasts[tk[2]];to.className='show '+tk[3];toastKey=tk[2]+lang;}}else if(toastKey){to.className='';toastKey=null;}
 const now=performance.now();if(now-lastK<90)return;lastK=now;
 const sv=SUBMIT.filter(x=>t>=x).length;$('kSurv').textContent=sv+' / 5';$('bSurv').style.width=sv*20+'%';
 const sz=SIZED.filter(x=>t>=x).length;$('kSize').textContent=sz+' / 5';$('bSize').style.width=sz*20+'%';
 const pv=BIZ.reduce((a,b,i)=>a+b.pv*clamp((t-PVS[i])/PVD),0),bt=BIZ.reduce((a,b,i)=>a+b.bat*clamp((t-BATS[i])/1),0);
 $('kPv').textContent=Math.round(pv)+' / '+TOT_PV+' kW';$('bPv').style.width=pv/TOT_PV*100+'%';$('kBat').textContent=Math.round(bt)+' / '+TOT_BAT+' kWh';$('bBat').style.width=bt/TOT_BAT*100+'%';
 const km=$('kMode');const isl=t>=ISLAND&&t<RESTORE;km.textContent=t<78?L().modeNone:isl?L().modeIsl:L().modeTied;km.classList.toggle('isl',isl);
 $('ops').classList.toggle('show',t>=84);
 if(t>=84){$('kHrs').textContent=(12*clamp((t-ISLAND)/(RESTORE-ISLAND))).toFixed(1)+' h';$('kOpen').textContent='5 / 5';$('kHome').textContent=(gridUp?8:0)+' / 8';}
 $('hint').style.opacity=(t<8||!guided)?1:0;}
let cardKey=null;
function showCard(k){cardKey=k;const it=L().info[k];if(!it)return;$('cT').textContent=it[0];$('cB').textContent=it[1];$('cA').style.display=it[2]?'inline-block':'none';$('card').classList.add('show');}
$('cardX').onclick=()=>{$('card').classList.remove('show');cardKey=null;};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();const shown=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};
function pick(ev){const r=canvas.getBoundingClientRect();mouse.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);
 for(const h of ray.intersectObjects(clickables,true)){if(h.object.isSprite||!shown(h.object))continue;let o=h.object;while(o&&!o.userData.key)o=o.parent;if(o)return o.userData.key;}return null;}
let down=null,hovT=0;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
canvas.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<6){const k=pick(e);if(k)showCard(k);}down=null;});
canvas.addEventListener('pointermove',e=>{if(e.buttons)return;const n=performance.now();if(n-hovT<80)return;hovT=n;canvas.classList.toggle('hot',!!pick(e));});
controls.addEventListener('start',()=>{if(guided){guided=false;updBtns();}});
$('playBtn').onclick=()=>{if(!playing&&t>=T)t=0;playing=!playing;updBtns();};
$('rstBtn').onclick=()=>{t=0;playing=true;guided=true;updBtns();};
$('camBtn').onclick=()=>{guided=!guided;updBtns();};
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;updBtns();});
$('lenBtn').onclick=()=>{lang='en';applyLang();};$('lesBtn').onclick=()=>{lang='es';applyLang();};
$('aboutBtn').onclick=()=>$('about').classList.add('show');$('aboutX').onclick=()=>$('about').classList.remove('show');
$('about').addEventListener('click',e=>{if(e.target.id==='about')$('about').classList.remove('show');});
let drag=false;function seek(e){const r=track.getBoundingClientRect();t=clamp((e.clientX-r.left)/r.width)*T;guided=true;updBtns();}
track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);seek(e);});track.addEventListener('pointermove',e=>{if(drag)seek(e);});track.addEventListener('pointerup',()=>{drag=false;});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('playBtn').click();}
 if(e.code==='ArrowRight'){let i=PH.findIndex(p=>p.s>t+.01);if(i<0)i=PH.length-1;t=PH[i].s+.01;guided=true;updBtns();}
 if(e.code==='ArrowLeft'){let i=0;for(let j=0;j<PH.length;j++)if(PH[j].s<t-.6)i=j;t=PH[i].s+.01;guided=true;updBtns();}});
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=camera.aspect<1?Math.min(75,2*Math.atan(Math.tan(27.5*D)/camera.aspect)/D):45;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();applyLang();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;amb+=dt;if(playing){t+=dt*speed;if(t>=T){t=T;playing=false;updBtns();}}
 update(t);if(guided){camAt(t);camera.position.copy(cp);controls.target.copy(cg);camera.lookAt(cg);}else controls.update();renderer.render(scene,camera);requestAnimationFrame(frame);}
window.__rocc={seek:v=>{t=v;playing=false;updBtns();}};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
